<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title description">
  <title id="title">Beyond Evals Lab assurance architecture</title>
  <desc id="description">A runtime assurance pipeline is connected to an offline evaluation pipeline through the shared verifyRefundOutcome function.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22c55e"/>
    </marker>
    <style>
      .node { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .active { fill: #312e81; stroke: #4338ca; stroke-width: 1.5; }
      .node-text { fill: #e2e8f0; font: 12px system-ui, sans-serif; text-anchor: middle; }
      .subtext { fill: #94a3b8; font: 11px system-ui, sans-serif; text-anchor: middle; }
      .lane { fill: #818cf8; font: 11px system-ui, sans-serif; font-weight: 700; letter-spacing: 1.2px; }
      .note { fill: #94a3b8; font: 11px system-ui, sans-serif; }
      .flow { fill: none; stroke: #6366f1; stroke-width: 1.75; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="600" rx="10" fill="#0f172a"/>

  <!-- Lane headings -->
  <text x="30" y="42" class="lane">RUNTIME ASSURANCE</text>
  <line x1="30" y1="50" x2="665" y2="50" stroke="#334155"/>
  <text x="700" y="42" class="lane">OFFLINE EVAL</text>
  <line x1="700" y1="50" x2="870" y2="50" stroke="#334155"/>

  <!-- Runtime pipeline: request → agent → controls → runtime → world state -->
  <rect x="30" y="86" width="95" height="44" rx="7" class="node"/>
  <text x="77.5" y="113" class="node-text">Request</text>

  <rect x="150" y="86" width="100" height="44" rx="7" class="node"/>
  <text x="200" y="113" class="node-text">Agent</text>
  <path d="M125 108 H148" class="flow"/>

  <!-- Controls deliberately occupy the action handoff, before Runtime. -->
  <rect x="275" y="76" width="135" height="64" rx="7" class="active"/>
  <text x="342.5" y="103" class="node-text" fill="#e0e7ff">Controls</text>
  <text x="342.5" y="121" class="subtext">pre-action gate</text>
  <path d="M250 108 H273" class="flow"/>

  <rect x="440" y="86" width="105" height="44" rx="7" class="active"/>
  <text x="492.5" y="113" class="node-text" fill="#e0e7ff">Runtime</text>
  <path d="M410 108 H438" class="flow"/>

  <rect x="570" y="86" width="120" height="44" rx="7" class="node"/>
  <text x="630" y="113" class="node-text">World State</text>
  <path d="M545 108 H568" class="flow"/>

  <!-- A control rejection is explicitly terminal and cannot reach state mutation. -->
  <rect x="289" y="162" width="107" height="38" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.25"/>
  <text x="342.5" y="186" fill="#fecaca" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BLOCKED</text>
  <path d="M342.5 140 V160" fill="none" stroke="#ef4444" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="342.5" y="216" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no state mutation</text>

  <!-- Run artifacts -->
  <rect x="145" y="205" width="140" height="44" rx="7" class="node"/>
  <text x="215" y="232" class="node-text">Trajectory Analysis</text>
  <path d="M200 130 V203" class="flow"/>

  <rect x="365" y="205" width="180" height="44" rx="7" class="node"/>
  <text x="455" y="225" class="node-text">Runtime Verification</text>
  <text x="455" y="241" class="subtext">verifyRefundOutcome()</text>

  <rect x="575" y="205" width="120" height="44" rx="7" class="node"/>
  <text x="635" y="232" class="node-text">Execution Trace</text>
  <path d="M630 130 V185 H455 V203" class="flow"/>
  <path d="M630 130 V203" class="flow"/>

  <!-- Per-run evidence collects independent forms of assurance evidence. -->
  <rect x="330" y="310" width="260" height="56" rx="8" class="active"/>
  <text x="460" y="334" class="node-text" fill="#e0e7ff" font-weight="700">Assurance Evidence</text>
  <text x="460" y="351" class="subtext">claims, evidence, and observed trajectory</text>
  <path d="M215 249 V280 H400 V308" class="flow"/>
  <path d="M455 249 V308" class="flow"/>
  <path d="M635 249 V280 H520 V308" class="flow"/>

  <!-- Offline evaluation lane -->
  <rect x="700" y="105" width="165" height="58" rx="7" class="node"/>
  <text x="782.5" y="130" class="node-text">Eval Datasets</text>
  <text x="782.5" y="148" class="subtext">curated regression fixtures</text>

  <rect x="700" y="215" width="165" height="64" rx="7" class="active"/>
  <text x="782.5" y="239" class="node-text" fill="#e0e7ff">Eval Harness</text>
  <text x="782.5" y="258" class="subtext">execute → trace → verify → grade</text>
  <path d="M782.5 163 V213" class="flow"/>

  <rect x="700" y="335" width="165" height="52" rx="7" class="node"/>
  <text x="782.5" y="357" class="node-text">Population Statistics</text>
  <text x="782.5" y="375" class="subtext">aggregate report</text>
  <path d="M782.5 279 V333" class="flow"/>

  <!-- The verifier is deliberately shared by both runtime and offline evaluation. -->
  <path d="M545 227 H698" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="621" y="217" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">same verifier</text>

  <!-- Assurance evidence is consumed in three distinct ways. -->
  <rect x="120" y="435" width="155" height="52" rx="7" class="node"/>
  <text x="197.5" y="457" class="node-text">Validation</text>
  <text x="197.5" y="475" class="subtext">outcome confidence</text>

  <rect x="365" y="435" width="165" height="52" rx="7" class="node" stroke="#22c55e"/>
  <text x="447.5" y="457" class="node-text">Monitoring</text>
  <text x="447.5" y="475" class="subtext">production traces</text>

  <path d="M400 366 V410 H197.5 V433" class="flow"/>
  <path d="M460 366 V433" class="flow"/>
  <path d="M590 338 H670 V247 H698" class="flow"/>
  <text x="649" y="327" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">per-run evidence</text>

  <!-- Production learning loop: monitored traces become curated future eval cases. -->
  <path d="M530 461 H670 V134 H698" fill="none" stroke="#22c55e" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="677" y="190" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">candidate fixtures →</text>
  <text x="677" y="205" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">human curation → regression tests</text>

  <!-- Connected interpretation panel: mechanisms and uses are orthogonal. -->
  <path d="M590 366 V510 H450 V523" fill="none" stroke="#475569" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="30" y="525" width="840" height="50" rx="8" fill="#111c31" stroke="#334155" stroke-width="1.25"/>
  <text x="55" y="548" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Evidence lenses</text>
  <line x1="185" y1="536" x2="185" y2="565" stroke="#334155"/>
  <text x="370" y="546" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">deterministic ↔ probabilistic</text>
  <text x="370" y="562" class="subtext">how evidence is produced</text>
  <line x1="555" y1="536" x2="555" y2="565" stroke="#334155"/>
  <text x="712" y="546" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">tests • verification • evals • monitoring • controls</text>
  <text x="712" y="562" class="subtext">how evidence is used</text>
</svg>
